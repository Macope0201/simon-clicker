<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Klicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #08060F;
    --violet: #8B6CFF;
    --pink: #FF5DA2;
    --gold: #FFC24B;
    --mint: #3FE8C4;
    --ink: #F5F2FF;
    --ink-dim: #9B92C4;
    --ink-faint: #6E6693;
    --card: rgba(255,255,255,0.04);
    --card-hover: rgba(255,255,255,0.075);
    --card-border: rgba(255,255,255,0.09);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    position: relative;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  input, textarea{
    -webkit-user-select: text;
    user-select: text;
  }

  .aurora{ position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .aurora span{ position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.35; animation: drift 22s ease-in-out infinite; }
  .aurora span:nth-child(1){ width: 480px; height: 480px; background: var(--violet); top: -160px; left: -100px; animation-duration: 26s; }
  .aurora span:nth-child(2){ width: 400px; height: 400px; background: var(--pink); top: 20%; right: -140px; animation-duration: 20s; animation-delay: -6s; }
  .aurora span:nth-child(3){ width: 380px; height: 380px; background: var(--mint); bottom: -140px; left: 15%; animation-duration: 24s; animation-delay: -12s; opacity: 0.2; }
  @keyframes drift{ 0%,100%{ transform: translate(0,0) scale(1); } 33%{ transform: translate(40px,30px) scale(1.08); } 66%{ transform: translate(-30px,20px) scale(0.95); } }

  .topbar{
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 28px;
    background: rgba(8,6,15,0.7);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .logo{ font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.3px; }
  .logo span{ color: var(--violet); }

  .topbar-stats{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

  .pill{ display: flex; align-items: baseline; gap: 5px; background: var(--card); border: 1px solid var(--card-border); padding: 7px 14px; border-radius: 999px; font-size: 0.85rem; white-space: nowrap; }
  .pill b{ font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 700; }
  .pill.klick b{ color: var(--gold); }
  .pill.cps b{ color: var(--mint); }
  .pill.power b{ color: var(--pink); }

  .layout{ display: flex; flex-direction: column; gap: 40px; max-width: 1100px; margin: 0 auto; padding: 44px 24px 100px; }

  .hero-col{ display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }

  .click-zone{ position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; margin: 12px 0 18px; }

  .glow{ position: absolute; inset: -20px; border-radius: 50%; background: conic-gradient(from 0deg, var(--violet), var(--pink), var(--gold), var(--mint), var(--violet)); filter: blur(26px); opacity: 0.6; animation: spin 9s linear infinite; transition: opacity 0.2s ease; }
  .glow.blazing{ opacity: 0.95; animation-duration: 2.5s; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #simonBtn{
    position: relative; width: 226px; height: 226px; border-radius: 50%; border: none;
    background: linear-gradient(155deg, #2E2456, #150F2B);
    box-shadow: 0 0 0 6px rgba(255,255,255,0.045), 0 22px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.07);
    cursor: pointer; padding: 0; overflow: hidden;
    transition: transform 0.12s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #simonBtn:hover{ box-shadow: 0 0 0 6px rgba(255,255,255,0.07), 0 22px 60px rgba(139,108,255,0.4), inset 0 0 0 1px rgba(255,255,255,0.09); transform: scale(1.02); }
  #simonBtn:active{ transform: scale(0.9); }

  #simonBtn img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: 0; transition: opacity 0.25s ease; z-index: 2; }
  #simonBtn img.loaded{ opacity: 1; }

  .placeholder-face{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 5rem; color: var(--ink); opacity: 0.85; z-index: 1; }

  .floater{ position: absolute; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.3rem; pointer-events: none; animation: floatUp 0.9s cubic-bezier(.2,.7,.3,1) forwards; z-index: 6; }
  .floater.crit{ font-size: 1.7rem; }
  @keyframes floatUp{ from{ opacity: 1; transform: translateY(0) scale(1); } to{ opacity: 0; transform: translateY(-85px) scale(1.2); } }

  .particle{ position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 5; transition: transform 0.5s ease-out, opacity 0.5s ease-out; }

  .rank-badge{ font-size: 0.78rem; color: var(--violet); font-weight: 600; letter-spacing: 0.2px; margin-bottom: 6px; }
  .rank-progress{ width: 150px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  .rank-progress-fill{ height: 100%; width: 0%; background: linear-gradient(90deg, var(--violet), var(--pink)); transition: width 0.3s ease; border-radius: 999px; }

  .combo-badge{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--gold);
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.15s ease, transform 0.15s cubic-bezier(.34,1.56,.64,1);
    height: 1.1rem;
    margin-bottom: 2px;
  }
  .combo-badge.active{ opacity: 1; transform: scale(1); }
  .combo-badge.hot{ color: var(--pink); text-shadow: 0 0 12px rgba(255,93,162,0.6); }

  .count{ font-family: 'Baloo 2', sans-serif; font-size: 3.2rem; font-weight: 800; line-height: 1; background: linear-gradient(90deg, var(--gold), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; }
  .count.pop{ animation: countPop 0.25s cubic-bezier(.34,1.56,.64,1); }
  @keyframes countPop{ 0%{ transform: scale(1); } 50%{ transform: scale(1.15); } 100%{ transform: scale(1); } }
  .count-unit{ color: var(--ink-dim); font-size: 1rem; font-weight: 500; margin-top: 4px; }

  .sub-stats{ display: flex; gap: 10px; margin-top: 16px; }

  .achievements-row{ display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: center; max-width: 280px; }
  .badge{ width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: var(--card); border: 1px solid var(--card-border); filter: grayscale(1); opacity: 0.3; transition: all 0.3s ease; }
  .badge.unlocked{ filter: none; opacity: 1; background: rgba(255,194,75,0.12); border-color: rgba(255,194,75,0.4); box-shadow: 0 0 14px rgba(255,194,75,0.25); animation: badgePop 0.4s ease; }
  @keyframes badgePop{ 0%{ transform: scale(0.6); } 60%{ transform: scale(1.15); } 100%{ transform: scale(1); } }

  .golden-banner{
    position: fixed;
    top: 76px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    z-index: 25;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1rem, 3vw, 1.6rem);
    letter-spacing: 0.5px;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(255,194,75,0.6), 0 0 40px rgba(255,194,75,0.35);
    background: rgba(10,7,18,0.55);
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,194,75,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap;
  }
  .golden-banner.visible{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .golden-orb{
    position: fixed; width: 58px; height: 58px; border-radius: 50%; border: none;
    padding: 0; overflow: hidden;
    background: radial-gradient(circle at 30% 30%, #fff3c4, var(--gold) 60%, #d98f1c);
    font-size: 1.5rem; cursor: pointer; z-index: 32;
    box-shadow: 0 0 20px rgba(255,194,75,0.7), 0 0 40px rgba(255,194,75,0.4);
    animation: pulseOrb 1s ease-in-out infinite;
    transition: top 1.2s ease-in-out, left 1.2s ease-in-out;
  }
  .golden-orb img{
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
  }
  @keyframes pulseOrb{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.12); } }

  .shop-panel{ width: 100%; }
  .shop-head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .shop-head h2{ font-family: 'Baloo 2', sans-serif; font-size: 1.25rem; font-weight: 700; margin: 0; color: var(--ink); }

  .head-controls{ display: flex; gap: 8px; flex-wrap: wrap; }

  .shop-columns{ display: flex; flex-direction: column; gap: 26px; }
  .shop-column{ flex: 1; min-width: 0; }
  .column-title{
    font-family: 'Baloo 2', sans-serif; font-size: 0.95rem; font-weight: 600;
    color: var(--ink-dim); margin: 0 0 10px; padding-left: 2px;
  }
  @media (min-width: 600px){
    .shop-columns{ flex-direction: row; }
  }

  .qty-tabs{ display: flex; gap: 6px; background: var(--card); border: 1px solid var(--card-border); padding: 4px; border-radius: 12px; }
  .qty-tab{ border: none; background: transparent; color: var(--ink-dim); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.82rem; padding: 7px 14px; border-radius: 9px; cursor: pointer; transition: background 0.15s ease, color 0.15s ease, transform 0.15s cubic-bezier(.34,1.56,.64,1); }
  .qty-tab:active{ transform: scale(0.9); }
  .qty-tab.active{ background: var(--violet); color: white; }

  .item{ display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--card-border); border-left: 3px solid var(--accent, var(--violet)); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; position: relative; overflow: hidden; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease; animation: itemIn 0.3s ease backwards; }
  .item:nth-child(1){ animation-delay: 0.01s; }
  .item:nth-child(2){ animation-delay: 0.03s; }
  .item:nth-child(3){ animation-delay: 0.05s; }
  .item:nth-child(4){ animation-delay: 0.07s; }
  .item:nth-child(5){ animation-delay: 0.09s; }
  .item:nth-child(6){ animation-delay: 0.11s; }
  .item:nth-child(7){ animation-delay: 0.13s; }
  .item:nth-child(8){ animation-delay: 0.15s; }
  .item:nth-child(9){ animation-delay: 0.17s; }
  .item:nth-child(10){ animation-delay: 0.19s; }
  .item:nth-child(11){ animation-delay: 0.21s; }
  .item:nth-child(12){ animation-delay: 0.23s; }
  .item:nth-child(13){ animation-delay: 0.25s; }
  .item:nth-child(14){ animation-delay: 0.27s; }
  @keyframes itemIn{ from{ opacity: 0; transform: translateY(6px); } to{ opacity: 1; transform: translateY(0); } }
  .item::before{ content: ''; position: absolute; inset: 0; width: var(--progress, 0%); background: linear-gradient(90deg, rgba(139,108,255,0.14), rgba(255,93,162,0.1)); transition: width 0.2s ease; z-index: 0; }
  .item > *{ position: relative; z-index: 1; }
  .item:hover:not(.disabled){ background: var(--card-hover); border-color: rgba(255,255,255,0.18); transform: translateY(-1px); }
  .item:active:not(.disabled){ transform: translateY(0) scale(0.99); }
  .item.disabled{ cursor: not-allowed; }
  .item.disabled .item-name, .item.disabled .item-cost{ opacity: 0.55; }

  .item-icon{ font-size: 1.7rem; width: 44px; height: 44px; border-radius: 11px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .item-info{ flex: 1; min-width: 0; }
  .item-name{ font-weight: 600; font-size: 0.97rem; }
  .item-desc{ color: var(--ink-dim); font-size: 0.8rem; margin-top: 2px; }
  .item-right{ text-align: right; flex-shrink: 0; }
  .item-cost{ font-family: 'Baloo 2', sans-serif; font-weight: 700; color: var(--gold); font-size: 1.02rem; }
  .item-owned{ font-size: 0.72rem; color: var(--ink-dim); margin-top: 2px; }

  .toast-wrap{ position: fixed; top: 76px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 30; align-items: center; }
  .toast{ background: rgba(18,12,32,0.95); border: 1px solid rgba(255,255,255,0.14); color: var(--ink); font-size: 0.85rem; font-weight: 500; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); animation: toastIn 0.3s ease, toastOut 0.4s ease 2.4s forwards; }
  @keyframes toastIn{ from{ opacity: 0; transform: translateY(-10px); } to{ opacity: 1; transform: translateY(0); } }
  @keyframes toastOut{ to{ opacity: 0; transform: translateY(-10px); } }

  @media (min-width: 760px){
    .layout{ flex-direction: row; align-items: flex-start; }
    .hero-col{ flex: 0 0 320px; position: sticky; top: 90px; }
    .shop-panel{ flex: 1; min-width: 0; }
  }

  .modal-overlay{
    position: fixed; inset: 0; background: rgba(5,3,10,0.72); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-overlay.visible{ display: flex; }

  .modal-box{
    position: relative;
    background: linear-gradient(160deg, #241a3f, #150F2B);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 28px 26px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    animation: modalIn 0.2s ease;
  }
  .admin-box{ max-width: 380px; }
  @keyframes modalIn{ from{ opacity: 0; transform: scale(0.95); } to{ opacity: 1; transform: scale(1); } }

  .modal-close{
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    border-radius: 50%; border: 1px solid var(--card-border); background: var(--card);
    color: var(--ink-dim); cursor: pointer; font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover{ color: var(--ink); background: var(--card-hover); }

  .modal-box h3{ font-family: 'Baloo 2', sans-serif; margin: 0 0 16px; font-size: 1.1rem; }

  .code-input{
    width: 100%; text-align: center; font-family: 'Baloo 2', sans-serif;
    font-size: 1.8rem; letter-spacing: 10px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--card-border); background: rgba(0,0,0,0.3); color: var(--ink);
  }
  .code-input:focus{ outline: none; border-color: var(--violet); }

  .admin-row{ margin-bottom: 16px; }
  .admin-row label{ display: block; font-size: 0.78rem; color: var(--ink-dim); margin-bottom: 6px; }
  .admin-controls{ display: flex; gap: 8px; }
  .admin-controls input{
    flex: 1; min-width: 0; padding: 9px 10px; border-radius: 9px;
    border: 1px solid var(--card-border); background: rgba(0,0,0,0.3); color: var(--ink); font-size: 0.85rem;
  }
  .admin-controls button{
    border: none; border-radius: 9px; padding: 9px 14px; font-size: 0.82rem; font-weight: 700;
    font-family: 'Inter', sans-serif; cursor: pointer; white-space: nowrap;
    background: linear-gradient(90deg, var(--violet), var(--pink)); color: white;
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .admin-controls button:active{ transform: scale(0.92); }
  .admin-controls button.danger{ background: linear-gradient(90deg, #E5484D, #B3261E); width: 100%; }

  /* Anpassad markeringsfärg istället för webbläsarens blå */
  ::selection{ background: rgba(139,108,255,0.4); color: #fff; }
  ::-moz-selection{ background: rgba(139,108,255,0.4); color: #fff; }

  .screen-flash{
    position: fixed; inset: 0; z-index: 45; pointer-events: none;
    background: radial-gradient(circle at center, rgba(255,194,75,0.35), transparent 65%);
    animation: flashFade 0.5s ease-out forwards;
  }
  @keyframes flashFade{ from{ opacity: 1; } to{ opacity: 0; } }

  .item.bought{ animation: boughtPulse 0.4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes boughtPulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,194,75,0.5); }
    60%{ box-shadow: 0 0 0 8px rgba(255,194,75,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,194,75,0); }
  }
</style>
</head>
<body>

  <div class="aurora"><span></span><span></span><span></span></div>

  <div class="topbar">
    <div class="logo">Simon <span id="secretWord">Klicker</span></div>
    <div class="topbar-stats">
      <div class="pill klick">Klick <b id="topClicks">0</b></div>
      <div class="pill cps">/sek <b id="topCps">0</b></div>
      <div class="pill power">Kraft <b id="topPower">1</b></div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div class="golden-banner" id="goldenBanner">A GOLDEN BEARNAISE JUST SPAWNED</div>

  <div class="layout">
    <div class="hero-col" id="heroCol">
      <div class="click-zone" id="clickZone">
        <div class="glow"></div>
        <button id="simonBtn" aria-label="Klicka på Simon">
          <img id="simonImg" src="simon.png" alt="Simon" onerror="this.classList.remove('loaded'); this.onerror=null; document.getElementById('placeholderFace').style.display='flex';" onload="this.classList.add('loaded'); document.getElementById('placeholderFace').style.display='none';">
          <span class="placeholder-face" id="placeholderFace">S</span>
        </button>
      </div>

      <div class="rank-badge" id="rankBadge">Nykomling</div>
      <div class="rank-progress"><div class="rank-progress-fill" id="rankProgressFill"></div></div>
      <div class="combo-badge" id="comboBadge">🔥 Combo x1</div>
      <div class="count" id="count">0</div>
      <div class="count-unit">klick totalt</div>

      <div class="sub-stats">
        <div class="pill cps">Auto <b id="cpsStat">0</b>/sek</div>
        <div class="pill power">Per klick <b id="powerStat">1</b></div>
      </div>

      <div class="achievements-row" id="achievementsRow"></div>
    </div>

    <div class="shop-panel">
      <div class="shop-head">
        <h2>Uppgraderingar</h2>
        <div class="head-controls">
          <div class="qty-tabs">
            <button class="qty-tab active" data-qty="1">x1</button>
            <button class="qty-tab" data-qty="10">x10</button>
            <button class="qty-tab" data-qty="25">x25</button>
          </div>
        </div>
      </div>

      <div class="shop-columns">
        <div class="shop-column">
          <h3 class="column-title">⚙️ Auto-klick</h3>
          <div id="shopListAuto"></div>
        </div>
        <div class="shop-column">
          <h3 class="column-title">💥 Klick-kraft</h3>
          <div id="shopListPower"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="codeModalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="codeModalClose" aria-label="Stäng">✕</button>
      <h3>Ange kod</h3>
      <input type="text" id="codeInput" class="code-input" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="••••">
    </div>
  </div>

  <div class="modal-overlay" id="adminModalOverlay">
    <div class="modal-box admin-box">
      <button class="modal-close" id="adminModalClose" aria-label="Stäng">✕</button>
      <h3>🔧 Adminpanel</h3>

      <div class="admin-row">
        <label>Ge dig själv klick (1 – 1000000000000000000000)</label>
        <div class="admin-controls">
          <input type="number" id="adminClicksInput" min="1" max="1000000000000000000000" placeholder="t.ex. 1000">
          <button id="adminGiveClicksBtn">Ge</button>
        </div>
      </div>

      <div class="admin-row">
        <label>Spawna Golden Bearnaise</label>
        <div class="admin-controls">
          <input type="number" id="adminGoldenInput" min="1" max="50" value="1">
          <button id="adminSpawnGoldenBtn">Spawna</button>
        </div>
      </div>

      <div class="admin-row">
        <label>Snabbfunktioner</label>
        <div class="admin-controls">
          <button id="adminMaxUpgradesBtn">Maxa uppgraderingar (+100 vardera)</button>
        </div>
      </div>

      <div class="admin-row">
        <label>Fara</label>
        <div class="admin-controls">
          <button id="adminResetBtn" class="danger">Nollställ all sparad data</button>
        </div>
      </div>
    </div>
  </div>

<script>
  let clicks = 0;
  let totalClicksEarned = 0;
  let cps = 0;
  let clickPower = 1;
  let buyQty = 1;
  let combo = 0;
  let comboTimeout = null;
  const COMBO_WINDOW = 900;
  const COMBO_MAX = 10;

  const autoItems = [
    { id: 'sibling', icon: '👦', name: "Klickare",           desc: "Klickar lite då och då",       baseCost: 15,             cps: 0.1,        owned: 0 },
    { id: 'squad',   icon: '🧑‍🤝‍🧑', name: "Simon Unc",       desc: "Hjälper till att klicka",      baseCost: 100,            cps: 1,          owned: 0 },
    { id: 'clones',  icon: '🧬', name: "Simon-Farm",         desc: "Fler Simon, mer klick",         baseCost: 600,            cps: 6,          owned: 0 },
    { id: 'factory', icon: '🏭', name: "Simon Baddie",       desc: "Holy Gyatt",                    baseCost: 3500,           cps: 30,         owned: 0 },
    { id: 'corp',    icon: '🏢', name: "Prime Simon",        desc: "För Mycket Aura",               baseCost: 20000,          cps: 150,        owned: 0 },
    { id: 'galaxy',  icon: '🌌', name: "Simon world",        desc: "Bästa stället",                 baseCost: 120000,         cps: 800,        owned: 0 },
    { id: 'sigma',   icon: '🧠', name: "Alpha simon",        desc: "Grindar i tysthet",             baseCost: 700000,         cps: 4000,       owned: 0 },
    { id: 'rizz',    icon: '😏', name: "Rizz Simon",         desc: "Charmar fram klick",            baseCost: 4000000,        cps: 20000,      owned: 0 },
    { id: 'ohio',    icon: '🧑', name: "Simon",              desc: "Simon",                         baseCost: 25000000,       cps: 100000,     owned: 0 },
    { id: 'empire',  icon: '🏰', name: "Simon Empire",       desc: "Ett helt imperium av Simon",    baseCost: 150000000,      cps: 500000,     owned: 0 },
    { id: 'multiv',  icon: '🌠', name: "Simon Multiverse",   desc: "Oändligt många Simon",          baseCost: 1000000000,     cps: 2500000,    owned: 0 },
    { id: 'sim',     icon: '🎮', name: "Simon 2",            desc: "Normal Simon dag",              baseCost: 6000000000,     cps: 12000000,   owned: 0 },
    { id: 'quantum', icon: '🐘', name: "Elephant Prutt",     desc: "Pruttar i alla dimensioner",    baseCost: 40000000000,    cps: 60000000,   owned: 0 },
    { id: 'singular',icon: '🧑', name: "Valter",             desc: "...",                           baseCost: 250000000000,   cps: 300000000,  owned: 0 },
  ];

  const powerItems = [
    { id: 'coffee',   icon: '☕', name: "Godis Åt Simon",       desc: "Piggare Simon, hårdare klick",   baseCost: 40,           power: 1,        owned: 0 },
    { id: 'gloves',   icon: '🧤', name: "Badboy Handskar",      desc: "Bättre grepp om musen",           baseCost: 250,          power: 3,        owned: 0 },
    { id: 'gym',      icon: '💪', name: "Ge sixpack",           desc: "Starkare klick-arm",              baseCost: 1500,         power: 10,       owned: 0 },
    { id: 'energy',   icon: '⚡', name: "Vara snäll mot simon", desc: "Extrem klick-energi",             baseCost: 9000,         power: 40,       owned: 0 },
    { id: 'legend',   icon: '👑', name: "Legendarisk Simon",    desc: "Varje klick är episkt",           baseCost: 60000,        power: 200,      owned: 0 },
    { id: 'serum',    icon: '🧪', name: "Simon Rizz-serum",     desc: "100% ren aura i flytande form",   baseCost: 400000,       power: 1000,     owned: 0 },
    { id: 'elixir',   icon: '🍅', name: "Anmie uwu",            desc: "Farligt Dåligt",                  baseCost: 2500000,      power: 5000,     owned: 0 },
    { id: 'grind',    icon: '📈', name: "Sigma Grindset",       desc: "Ingen dagar av vila",             baseCost: 15000000,     power: 25000,    owned: 0 },
    { id: 'chad',     icon: '🏋️', name: "Gigachad Simon",       desc: "Maximal klick-kapacitet",         baseCost: 90000000,     power: 120000,   owned: 0 },
    { id: 'aimbot',   icon: '🎯', name: "Simon Hacker",         desc: "Träffar rätt varje gång",         baseCost: 550000000,    power: 600000,   owned: 0 },
    { id: 'godmode',  icon: '🛡️', name: "Simon bajskorvar ",    desc: "Oövervinnerlig klick-kraft",      baseCost: 3500000000,   power: 3000000,  owned: 0 },
    { id: 'omega',    icon: '♾️', name: "Real Simon",           desc: "Bortom all fattningsförmåga",     baseCost: 20000000000,  power: 15000000, owned: 0 },
  ];

  const achievements = [
    { threshold: 50,           icon: '👋', title: 'Första klicken',    unlocked: false },
    { threshold: 500,          icon: '🔥', title: 'Uppvärmning',        unlocked: false },
    { threshold: 5000,         icon: '⚡', title: 'Klick-feber',         unlocked: false },
    { threshold: 50000,        icon: '🏆', title: 'Klick-mästare',       unlocked: false },
    { threshold: 500000,       icon: '🌌', title: 'Legendarisk',         unlocked: false },
    { threshold: 5000000,      icon: '👑', title: 'Simon-gud',           unlocked: false },
    { threshold: 50000000,     icon: '🗿', title: 'Sigma-klickare',      unlocked: false },
    { threshold: 500000000,    icon: '🌀', title: 'Simon-final',        unlocked: false },
    { threshold: 5000000000,   icon: '🌠', title: 'Multiversal Simon',   unlocked: false },
    { threshold: 50000000000,  icon: '♾️', title: 'Prime-Simon',         unlocked: false },
  ];

  const ranks = [
    { min: 0,             title: 'Nykomling' },
    { min: 100,            title: 'Klickare' },
    { min: 1000,           title: 'Simon-fantast' },
    { min: 10000,          title: 'Klick-mästare' },
    { min: 100000,         title: 'Legendarisk klickare' },
    { min: 1000000,        title: 'Simon-gud' },
    { min: 10000000,       title: 'Sigma-legend' },
    { min: 100000000,      title: 'Simon Overlord' },
    { min: 1000000000,     title: 'Multiversal härskare' },
    { min: 10000000000,    title: 'Simon Singularitet' },
  ];

  const SAVE_KEY = 'simonKlickerSaveV1';

  function saveGame(){
    try{
      const data = {
        clicks, totalClicksEarned,
        autoOwned: autoItems.map(i => i.owned),
        powerOwned: powerItems.map(i => i.owned),
        achievementsUnlocked: achievements.map(a => a.unlocked),
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }catch(e){ /* localStorage kan vara blockerat, ignorera tyst */ }
  }

  function loadGame(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      clicks = data.clicks || 0;
      totalClicksEarned = data.totalClicksEarned || 0;
      if (Array.isArray(data.autoOwned)) autoItems.forEach((it, i) => it.owned = data.autoOwned[i] || 0);
      if (Array.isArray(data.powerOwned)) powerItems.forEach((it, i) => it.owned = data.powerOwned[i] || 0);
      if (Array.isArray(data.achievementsUnlocked)) achievements.forEach((a, i) => a.unlocked = !!data.achievementsUnlocked[i]);
    }catch(e){ /* korrupt data, kör med tomt sparfält */ }
  }

  const countEl = document.getElementById('count');
  const topClicks = document.getElementById('topClicks');
  const topCps = document.getElementById('topCps');
  const topPower = document.getElementById('topPower');
  const cpsStat = document.getElementById('cpsStat');
  const powerStat = document.getElementById('powerStat');
  const rankBadge = document.getElementById('rankBadge');
  const rankProgressFill = document.getElementById('rankProgressFill');
  const comboBadge = document.getElementById('comboBadge');
  const shopListAuto = document.getElementById('shopListAuto');
  const shopListPower = document.getElementById('shopListPower');
  const simonBtn = document.getElementById('simonBtn');
  const clickZone = document.getElementById('clickZone');
  const heroCol = document.getElementById('heroCol');
  const toastWrap = document.getElementById('toastWrap');
  const qtyTabs = document.querySelectorAll('.qty-tab');
  const achievementsRow = document.getElementById('achievementsRow');
  const goldenBanner = document.getElementById('goldenBanner');

  const floaterColors = ['#FFC24B', '#FF5DA2', '#8B6CFF', '#3FE8C4'];

  qtyTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      qtyTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      buyQty = parseInt(tab.dataset.qty, 10);
      renderShop();
    });
  });

  achievements.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'badge';
    el.textContent = a.icon;
    el.title = a.title;
    el.dataset.index = i;
    achievementsRow.appendChild(el);
  });

  function costForQty(item, qty){
    let total = 0;
    for(let k = 0; k < qty; k++){
      total += Math.ceil(item.baseCost * Math.pow(1.15, item.owned + k));
    }
    return total;
  }

  function formatNum(n){
    if (n < 1000) return Math.floor(n).toString();
    const suffixes = ['', 'k', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc'];
    let tier = Math.floor(Math.log10(n) / 3);
    tier = Math.min(tier, suffixes.length - 1);
    const scaled = n / Math.pow(1000, tier);
    return scaled.toFixed(scaled < 10 ? 2 : 1) + suffixes[tier];
  }

  function formatRate(n){
    if (n < 1) return n.toFixed(2);
    if (n < 1000) return Number.isInteger(n) ? n.toString() : n.toFixed(1);
    return formatNum(n);
  }

  function rankInfo(){
    let idx = 0;
    for (let i = 0; i < ranks.length; i++){
      if (totalClicksEarned >= ranks[i].min) idx = i;
    }
    const current = ranks[idx];
    const next = ranks[idx + 1];
    let progress = 100;
    if (next){
      progress = ((totalClicksEarned - current.min) / (next.min - current.min)) * 100;
    }
    return { title: current.title, progress: Math.max(0, Math.min(100, progress)) };
  }

  function recalcStats(){
    cps = autoItems.reduce((sum, i) => sum + i.owned * i.cps, 0);
    clickPower = 1 + powerItems.reduce((sum, i) => sum + i.owned * i.power, 0);
  }

  function renderStats(){
    countEl.textContent = formatNum(clicks);
    topClicks.textContent = formatNum(clicks);
    topCps.textContent = formatRate(cps);
    topPower.textContent = formatRate(clickPower);
    cpsStat.textContent = formatRate(cps);
    powerStat.textContent = formatRate(clickPower);
    const rank = rankInfo();
    rankBadge.textContent = rank.title;
    rankProgressFill.style.width = rank.progress + '%';
  }

  function renderAchievements(){
    achievementsRow.querySelectorAll('.badge').forEach((el, i) => {
      el.classList.toggle('unlocked', achievements[i].unlocked);
    });
  }

  let shopRows = []; // { item, row, costEl, ownedEl }

  function renderColumn(list, container, type){
    container.innerHTML = '';
    list.forEach((item, idx) => {
      const cost = costForQty(item, buyQty);
      const canAfford = clicks >= cost;
      const progress = Math.min(100, (clicks / cost) * 100);
      const gain = type === 'auto'
        ? `+${formatRate(item.cps * buyQty)}/sek`
        : `+${formatRate(item.power * buyQty)} kraft`;
      const accent = ['var(--violet)', 'var(--pink)', 'var(--gold)', 'var(--mint)'][idx % 4];

      const row = document.createElement('div');
      row.className = 'item' + (canAfford ? '' : ' disabled');
      row.style.setProperty('--progress', canAfford ? '100%' : progress + '%');
      row.style.setProperty('--accent', accent);
      row.innerHTML = `
        <div class="item-icon">${item.icon}</div>
        <div class="item-info">
          <div class="item-name">${item.name}${buyQty > 1 ? ' ×' + buyQty : ''}</div>
          <div class="item-desc">${item.desc} · ${gain}</div>
        </div>
        <div class="item-right">
          <div class="item-cost"></div>
          <div class="item-owned"></div>
        </div>
      `;
      const costEl = row.querySelector('.item-cost');
      const ownedEl = row.querySelector('.item-owned');
      costEl.textContent = formatNum(cost);
      ownedEl.textContent = 'Ägda: ' + item.owned;

      row.addEventListener('click', () => buy(item));
      container.appendChild(row);
      shopRows.push({ item, row, costEl, ownedEl });
    });
  }

  function renderShop(){
    shopRows = [];
    renderColumn(autoItems, shopListAuto, 'auto');
    renderColumn(powerItems, shopListPower, 'power');
  }

  function updateShopState(){
    shopRows.forEach(({ item, row, costEl, ownedEl }) => {
      const cost = costForQty(item, buyQty);
      const canAfford = clicks >= cost;
      const progress = Math.min(100, (clicks / cost) * 100);
      row.classList.toggle('disabled', !canAfford);
      row.style.setProperty('--progress', canAfford ? '100%' : progress + '%');
      costEl.textContent = formatNum(cost);
      ownedEl.textContent = 'Ägda: ' + item.owned;
    });
  }

  function buy(item){
    const cost = costForQty(item, buyQty);
    if (clicks < cost) return;
    clicks -= cost;
    item.owned += buyQty;
    recalcStats();
    renderStats();
    updateShopState();
    saveGame();

    const rowData = shopRows.find(r => r.item === item);
    if (rowData){
      rowData.row.classList.remove('bought');
      void rowData.row.offsetWidth; // tvinga omstart av animationen
      rowData.row.classList.add('bought');
    }
  }

  function spawnFloater(x, y, amount, crit){
    const f = document.createElement('div');
    f.className = 'floater' + (crit ? ' crit' : '');
    f.textContent = (crit ? 'KRITISKT +' : '+') + formatNum(amount);
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    f.style.color = crit ? '#FF5DA2' : floaterColors[Math.floor(Math.random() * floaterColors.length)];
    clickZone.appendChild(f);
    setTimeout(() => f.remove(), 900);
  }

  function spawnParticles(x, y){
    for (let i = 0; i < 7; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = floaterColors[Math.floor(Math.random() * floaterColors.length)];
      p.style.transform = 'translate(0,0)';
      p.style.opacity = '1';
      clickZone.appendChild(p);
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      requestAnimationFrame(() => {
        p.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
        p.style.opacity = '0';
      });
      setTimeout(() => p.remove(), 520);
    }
  }

  function flashScreen(){
    const flash = document.createElement('div');
    flash.className = 'screen-flash';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 500);
  }

  function showToast(text){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    toastWrap.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  function checkAchievements(){
    achievements.forEach(a => {
      if (!a.unlocked && totalClicksEarned >= a.threshold){
        a.unlocked = true;
        showToast(`🏅 Ny prestation: ${a.title}`);
        renderAchievements();
      }
    });
  }

  function addClicks(amount){
    clicks += amount;
    totalClicksEarned += amount;
    checkAchievements();
  }

  function updateComboUI(){
    comboBadge.textContent = `🔥 Combo x${(1 + combo * 0.08).toFixed(2)}`;
    comboBadge.classList.toggle('active', combo >= 1);
    comboBadge.classList.toggle('hot', combo >= 6);
    document.querySelector('.glow').classList.toggle('blazing', combo >= 6);
  }

  simonBtn.addEventListener('click', (e) => {
    combo = Math.min(COMBO_MAX, combo + 1);
    clearTimeout(comboTimeout);
    comboTimeout = setTimeout(() => { combo = 0; updateComboUI(); }, COMBO_WINDOW);
    updateComboUI();

    const comboMultiplier = 1 + combo * 0.08; // upp till +80% vid max combo
    const crit = Math.random() < 0.08;
    const gain = clickPower * (crit ? 5 : 1) * comboMultiplier;
    addClicks(gain);
    const rect = clickZone.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    spawnFloater(x, y, gain, crit);
    spawnParticles(x, y);
    renderStats();
    updateShopState();
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space'){
      e.preventDefault();
      simonBtn.click();
    }
  });

  let activeGoldenCount = 0;

  function spawnGolden(isAuto){
    activeGoldenCount++;
    goldenBanner.classList.add('visible');

    const orb = document.createElement('button');
    orb.className = 'golden-orb';
    orb.setAttribute('aria-label', 'Golden Bearnaise bonus');
    orb.innerHTML = `
      <img src="IMG_3534.jpg" alt="Golden Bearnaise" onerror="this.style.display='none'; this.parentElement.textContent='✨';">
    `;
    document.body.appendChild(orb);

    function moveOrb(){
      const maxLeft = window.innerWidth - 74;
      const maxTop = window.innerHeight - 74;
      orb.style.left = (10 + Math.random() * Math.max(10, maxLeft - 10)) + 'px';
      orb.style.top = (80 + Math.random() * Math.max(10, maxTop - 80)) + 'px';
    }
    moveOrb();
    const moveInterval = setInterval(moveOrb, 1300); // medium fart runt skärmen

    let cleaned = false;
    function cleanup(){
      if (cleaned) return;
      cleaned = true;
      clearInterval(moveInterval);
      clearTimeout(lifeTimeout);
      if (orb.parentNode) orb.remove();
      activeGoldenCount = Math.max(0, activeGoldenCount - 1);
      if (activeGoldenCount === 0) goldenBanner.classList.remove('visible');
    }

    const lifeTimeout = setTimeout(() => {
      cleanup();
      if (isAuto) scheduleGolden();
    }, 10000); // stannar i 10 sekunder

    orb.addEventListener('click', () => {
      const multiplier = 0.8 + Math.random() * 0.7; // 80%–150%
      const bonus = Math.round(clicks * multiplier);
      addClicks(bonus);
      showToast(`🥇 Golden Bearnaise! +${formatNum(bonus)} klick (${Math.round(multiplier * 100)}%)`);
      flashScreen();
      cleanup();
      renderStats();
      updateShopState();
      saveGame();
      if (isAuto) scheduleGolden();
    });
  }

  function scheduleGolden(){
    const delay = 240000 + Math.random() * 120000; // 4–6 minuter
    setTimeout(() => spawnGolden(true), delay);
  }

  setInterval(() => {
    if (cps > 0){
      addClicks(cps / 10);
      renderStats();
      updateShopState();
    }
  }, 100);

  // --- Hemlig admin-åtkomst ---
  const secretWord = document.getElementById('secretWord');
  const codeModalOverlay = document.getElementById('codeModalOverlay');
  const codeModalClose = document.getElementById('codeModalClose');
  const codeInput = document.getElementById('codeInput');
  const adminModalOverlay = document.getElementById('adminModalOverlay');
  const adminModalClose = document.getElementById('adminModalClose');

  function openCodeModal(){
    codeInput.value = '';
    codeModalOverlay.classList.add('visible');
    setTimeout(() => codeInput.focus(), 50);
  }
  function closeCodeModal(){ codeModalOverlay.classList.remove('visible'); }
  function closeAdminModal(){ adminModalOverlay.classList.remove('visible'); }

  secretWord.addEventListener('click', openCodeModal);
  codeModalClose.addEventListener('click', closeCodeModal);
  adminModalClose.addEventListener('click', closeAdminModal);

  codeModalOverlay.addEventListener('click', (e) => { if (e.target === codeModalOverlay) closeCodeModal(); });
  adminModalOverlay.addEventListener('click', (e) => { if (e.target === adminModalOverlay) closeAdminModal(); });

  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/[^0-9]/g, '');
    if (codeInput.value.length === 4){
      if (codeInput.value === '2012'){
        closeCodeModal();
        adminModalOverlay.classList.add('visible');
      }
      codeInput.value = '';
    }
  });

  // --- Adminpanelens funktioner ---
  document.getElementById('adminGiveClicksBtn').addEventListener('click', () => {
    const input = document.getElementById('adminClicksInput');
    const val = parseFloat(input.value);
    if (!isNaN(val) && val > 0){
      addClicks(val);
      renderStats();
      updateShopState();
      saveGame();
      showToast(`🔧 Admin: +${formatNum(val)} klick`);
      input.value = '';
    }
  });

  document.getElementById('adminSpawnGoldenBtn').addEventListener('click', () => {
    const input = document.getElementById('adminGoldenInput');
    let n = parseInt(input.value, 10) || 1;
    n = Math.max(1, Math.min(n, 50));
    for (let i = 0; i < n; i++){
      setTimeout(() => spawnGolden(false), i * 350);
    }
    showToast(`🔧 Admin: spawnade ${n} Golden Bearnaise`);
  });

  document.getElementById('adminMaxUpgradesBtn').addEventListener('click', () => {
    autoItems.forEach(i => i.owned += 100);
    powerItems.forEach(i => i.owned += 100);
    recalcStats();
    renderStats();
    updateShopState();
    saveGame();
    showToast('🔧 Admin: alla uppgraderingar +100');
  });

  document.getElementById('adminResetBtn').addEventListener('click', () => {
    if (confirm('Nollställ all sparad data? Det går inte att ångra.')){
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      location.reload();
    }
  });

  // --- Init ---
  loadGame();
  recalcStats();
  renderStats();
  renderShop();
  renderAchievements();
  updateComboUI();

  // Första Golden Bearnaise kommer snabbt för att haka nya spelare,
  // därefter följer det vanliga 4–6 minuters-schemat.
  setTimeout(() => spawnGolden(true), 30000 + Math.random() * 20000);

  setInterval(saveGame, 5000);
  window.addEventListener('beforeunload', saveGame);
</script>
