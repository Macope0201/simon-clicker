<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Klicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0E0B1A;
    --bg-mid: #1A1330;
    --violet: #7C5CFF;
    --pink: #FF5DA2;
    --gold: #FFC24B;
    --mint: #3FE8C4;
    --ink: #F3EFFF;
    --ink-dim: #9C93C4;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.08);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(124,92,255,0.25), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,93,162,0.18), transparent 40%),
      var(--bg-deep);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 90px;
  }

  .app{
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand{
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 2.7rem);
    margin: 0;
    letter-spacing: -0.5px;
    color: var(--ink);
  }

  h1 span{ color: var(--violet); }

  .tagline{
    color: var(--ink-dim);
    font-size: 0.98rem;
    margin: 6px 0 38px;
    text-align: center;
  }

  .click-zone{
    position: relative;
    width: 230px;
    height: 230px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }

  .glow{
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--violet), var(--pink), var(--gold), var(--mint), var(--violet));
    filter: blur(22px);
    opacity: 0.55;
    animation: spin 8s linear infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  #simonBtn{
    position: relative;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(155deg, #2A2050, #150F2B);
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.04),
      0 20px 45px rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(255,255,255,0.06);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 0.09s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  #simonBtn:hover{
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.06),
      0 20px 55px rgba(124,92,255,0.35),
      inset 0 0 0 1px rgba(255,255,255,0.08);
  }

  #simonBtn:active{ transform: scale(0.93); }

  #simonBtn img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  #simonBtn img.loaded{ display: block; }

  .placeholder-face{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 4.6rem;
    color: var(--ink);
    opacity: 0.85;
  }

  .floater{
    position: absolute;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    pointer-events: none;
    animation: floatUp 0.9s cubic-bezier(.2,.7,.3,1) forwards;
  }

  @keyframes floatUp{
    from{ opacity: 1; transform: translateY(0) scale(1); }
    to{ opacity: 0; transform: translateY(-80px) scale(1.15); }
  }

  .stat-row{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }

  .count{
    font-family: 'Baloo 2', sans-serif;
    font-size: 2.9rem;
    font-weight: 800;
    color: var(--ink);
    line-height: 1;
  }

  .count-unit{
    color: var(--ink-dim);
    font-size: 1rem;
    font-weight: 500;
  }

  .cps-pill{
    background: rgba(63,232,196,0.12);
    border: 1px solid rgba(63,232,196,0.3);
    color: var(--mint);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .shop{
    width: 100%;
  }

  .shop h2{
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink-dim);
    margin: 0 0 14px;
    padding-left: 2px;
  }

  .item{
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .item:hover:not(.disabled){
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.16);
    transform: translateY(-1px);
  }

  .item:active:not(.disabled){ transform: translateY(0) scale(0.99); }

  .item.disabled{ opacity: 0.4; cursor: not-allowed; }

  .item-icon{
    font-size: 1.6rem;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .item-info{ flex: 1; min-width: 0; }

  .item-name{
    font-weight: 600;
    font-size: 0.96rem;
  }

  .item-desc{
    color: var(--ink-dim);
    font-size: 0.8rem;
    margin-top: 2px;
  }

  .item-right{ text-align: right; flex-shrink: 0; }

  .item-cost{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    color: var(--gold);
    font-size: 1rem;
  }

  .item-owned{
    font-size: 0.72rem;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .toast-wrap{
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
    align-items: center;
  }

  .toast{
    background: rgba(20,14,40,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--ink);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    animation: toastIn 0.3s ease, toastOut 0.4s ease 2.2s forwards;
  }

  @keyframes toastIn{ from{ opacity: 0; transform: translateY(-10px); } to{ opacity: 1; transform: translateY(0); } }
  @keyframes toastOut{ to{ opacity: 0; transform: translateY(-10px); } }

  footer{
    margin-top: 44px;
    color: var(--ink-dim);
    font-size: 0.78rem;
    text-align: center;
  }

  footer code{
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 5px;
  }
</style>
</head>
<body>

  <div class="toast-wrap" id="toastWrap"></div>

  <div class="app">
    <div class="brand">
      <h1>Simon <span>Klicker</span></h1>
    </div>
    <p class="tagline">Klicka på Simon. Bygg din armé. Klicka snabbare.</p>

    <div class="click-zone">
      <div class="glow"></div>
      <button id="simonBtn" aria-label="Klicka på Simon">
        <!-- Byt gärna src nedan mot en riktig bild, t.ex. "simon.jpg" -->
        <img id="simonImg" src="simon.png" alt="Simon" onerror="this.classList.remove('loaded'); this.onerror=null;" onload="this.classList.add('loaded');">
        <span class="placeholder-face" id="placeholderFace">S</span>
      </button>
    </div>

    <div class="stat-row">
      <div>
        <span class="count" id="count">0</span>
        <span class="count-unit"> klick</span>
      </div>
      <div class="cps-pill" id="cps">0 /sek</div>
    </div>

    <div class="shop">
      <h2>Uppgraderingar</h2>
      <div id="shopList"></div>
    </div>

    <footer>
      Lägg en bild med namnet <code>simon.png</code> i samma mapp som denna fil, så visas den automatiskt istället för "S".
    </footer>
  </div>

<script>
  let clicks = 0;
  let cps = 0;
  let nextMilestone = 100;

  const items = [
    { id: 'sibling', icon: '👦', name: "Simons lillebror",    desc: "Klickar lite då och då",   baseCost: 15,     cps: 0.1, owned: 0 },
    { id: 'squad',   icon: '🧑‍🤝‍🧑', name: "Simons kompisgäng", desc: "Hjälper till att klicka", baseCost: 100,    cps: 1,   owned: 0 },
    { id: 'clones',  icon: '🧬', name: "Simon-kloner",         desc: "Fler Simon, mer klick",     baseCost: 600,    cps: 6,   owned: 0 },
    { id: 'factory', icon: '🏭', name: "Klick-fabriken",       desc: "Massproducerar klick",       baseCost: 3500,   cps: 30,  owned: 0 },
    { id: 'corp',    icon: '🏢', name: "Simon Corp",           desc: "Ett helt företag av Simon",   baseCost: 20000,  cps: 150, owned: 0 },
    { id: 'galaxy',  icon: '🌌', name: "Simon-galaxen",        desc: "Klickar över hela kosmos",    baseCost: 120000, cps: 800, owned: 0 },
  ];

  const countEl = document.getElementById('count');
  const cpsEl = document.getElementById('cps');
  const shopList = document.getElementById('shopList');
  const simonBtn = document.getElementById('simonBtn');
  const clickZone = document.querySelector('.click-zone');
  const toastWrap = document.getElementById('toastWrap');

  const floaterColors = ['#FFC24B', '#FF5DA2', '#7C5CFF', '#3FE8C4'];

  function costFor(item){
    return Math.ceil(item.baseCost * Math.pow(1.15, item.owned));
  }

  function formatNum(n){
    if (n < 1000) return Math.floor(n).toString();
    if (n < 1000000) return (n / 1000).toFixed(1) + 'k';
    return (n / 1000000).toFixed(2) + 'M';
  }

  function render(){
    countEl.textContent = formatNum(clicks);
    cpsEl.textContent = formatNum(cps) + ' /sek';

    shopList.innerHTML = '';
    items.forEach(item => {
      const cost = costFor(item);
      const canAfford = clicks >= cost;

      const row = document.createElement('div');
      row.className = 'item' + (canAfford ? '' : ' disabled');
      row.innerHTML = `
        <div class="item-icon">${item.icon}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc} · +${item.cps}/sek</div>
        </div>
        <div class="item-right">
          <div class="item-cost">${formatNum(cost)}</div>
          <div class="item-owned">Ägda: ${item.owned}</div>
        </div>
      `;
      row.addEventListener('click', () => buy(item));
      shopList.appendChild(row);
    });
  }

  function buy(item){
    const cost = costFor(item);
    if (clicks < cost) return;
    clicks -= cost;
    item.owned += 1;
    cps = items.reduce((sum, i) => sum + i.owned * i.cps, 0);
    render();
  }

  function spawnFloater(x, y){
    const f = document.createElement('div');
    f.className = 'floater';
    f.textContent = '+1';
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    f.style.color = floaterColors[Math.floor(Math.random() * floaterColors.length)];
    clickZone.appendChild(f);
    setTimeout(() => f.remove(), 900);
  }

  function showToast(text){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    toastWrap.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  function checkMilestone(){
    if (clicks >= nextMilestone){
      showToast(`🎉 ${formatNum(nextMilestone)} klick uppnådda!`);
      nextMilestone *= 5;
    }
  }

  simonBtn.addEventListener('click', (e) => {
    clicks += 1;
    const rect = clickZone.getBoundingClientRect();
    spawnFloater(e.clientX - rect.left, e.clientY - rect.top);
    checkMilestone();
    render();
  });

  setInterval(() => {
    if (cps > 0){
      clicks += cps / 10;
      checkMilestone();
      render();
    }
  }, 100);

  render();
</script>

</body>
</html>
